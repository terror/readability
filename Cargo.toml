[package]
name = "unclutter"
version = "0.1.0"
description = "A Rust port of Mozilla's Readability"
authors = ["Liam <liam@scalzulli.com>"]
license = "CC0-1.0"
repository = "https://github.com/terror/unclutter"
edition = "2024"
categories = ["command-line-utilities", "text-processing", "web-programming"]
keywords = ["readability", "html", "article", "extraction", "reader-mode"]

include = [
  "/LICENSE",
  "/README.md",
  "/src/",
]

[workspace]
members = [".", "crates/*"]

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
enum_glob_use = "allow"
ignore_without_reason = "allow"
needless_pass_by_value = "allow"
pedantic = { level = "deny", priority = -1 }
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
type_complexity = "allow"
undocumented_unsafe_blocks = "deny"
unnecessary_wraps = "allow"
wildcard_imports = "allow"

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = true

[[bench]]
name = "parse"
harness = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
dom_query = "0.28"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
assert-html-eq = { git = "https://github.com/terror/assert-html-eq" }
criterion = "0.8.2"
paste = "1.0"
pretty_assertions = "1.4"
