[package]
name = "unclutter-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
unclutter = { version = "0.2.0", path = "../.." }
wasm-bindgen = "0.2.130"

[dev-dependencies]
serde_json = "1.0.154"
