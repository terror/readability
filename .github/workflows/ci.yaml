name: CI

on:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  RUSTFLAGS: --deny warnings

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        submodules: recursive

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        components: llvm-tools-preview

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

    - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c
      with:
        tool: cargo-llvm-cov

    - name: Generate coverage report
      run: cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path lcov.info

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        flags: unit
        fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

    - name: Clippy
      run: cargo clippy --all --all-targets

    - name: Format
      run: cargo fmt --all -- --check

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install ripgrep shellcheck

    - name: Check for Forbidden Words
      run: ./bin/forbid

    - name: Check /bin scripts
      run: shellcheck bin/*

  msrv:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

    - name: Check
      run: cargo check

  test:
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        submodules: recursive

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

    - name: Test
      run: cargo test --all

  wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        target: wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

    - name: Build
      run: cargo build --package unclutter-wasm --target wasm32-unknown-unknown --locked

  zizmor:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd
